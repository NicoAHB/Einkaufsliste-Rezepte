# Führt die Tests bei jeder Änderung aus (Logiktests und Browsertests in Chromium).
# Die App selbst braucht keinen Build; diese Datei betrifft nur die Prüfung.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logiktests
        run: npm run test:logic
      - name: Playwright installieren (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browsertests
        run: npm run test:browser
